name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # setup-go uses check-latest, so builds get Go security fixes before the runner images do.
  GO_VERSION: "1.26.x"
  WAILS: github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

jobs:
  cli:
    name: Command-line tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Test
        run: go test -count=1 ./...
      - name: Build archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            name="veilfold_${version}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/shenyizg/veilfold/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "build/$name/veilfold$ext" ./cmd/veilfold
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli
          path: dist/*

  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          - name: Windows
            os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            gui/go.sum
      - name: Set app version
        working-directory: gui
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import json, sys
          path = "wails.json"
          config = json.load(open(path, encoding="utf-8"))
          # Windows version resources need a plain X.Y.Z version.
          config["info"]["productVersion"] = sys.argv[1].split("-")[0]
          json.dump(config, open(path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          EOF
      - name: Build
        working-directory: gui
        run: >
          go run ${{ env.WAILS }} build -clean -skipbindings -trimpath
          -platform ${{ matrix.platform }}
          -ldflags "-X github.com/shenyizg/veilfold/internal/version.Version=${GITHUB_REF_NAME}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent gui/build/bin/Veilfold.app "dist/Veilfold-Desktop_${GITHUB_REF_NAME#v}_macos_universal.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path gui/build/bin/Veilfold.exe, LICENSE, README.md `
            -DestinationPath "dist/Veilfold-Desktop_${version}_windows_amd64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish draft release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          # GitHub compares asset names case-insensitively, so names must differ by more than case.
          clashes="$(ls | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
          if [ -n "$clashes" ]; then
            echo "Asset names that differ only in case:"; echo "$clashes"; exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
